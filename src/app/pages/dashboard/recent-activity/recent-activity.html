<div class="card activity-card">
  <div class="card-header">
    <h3>Recent Activity</h3>
    <a href="#" class="view-all">View All</a>
  </div>

  <div class="activity-list">
    @for (activity of activities; track activity.time + activity.user) {
      <div class="activity-item">
        <div class="activity-avatar" [style.background]="activity.avatarBg">
          @if (activity.icon) {
            <span class="material-icons-outlined">{{ activity.icon }}</span>
          } @else {
            <span class="initials">{{ activity.initials }}</span>
          }
        </div>
        <div class="activity-content">
          <p class="activity-text">
            <strong>{{ activity.user }}</strong> {{ activity.action }}
            @if (activity.target) {
              <a href="#" class="activity-link">{{ activity.target }}</a>
            }
          </p>
          <span class="activity-time">{{ activity.time }}</span>
        </div>
      </div>
    }
  </div>
</div>
